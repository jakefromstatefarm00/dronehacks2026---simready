# The randomisation ranges used for training (the defaults in team_mission/rl/dynamics.py, written
# out so you can copy and edit them). [low, high] per episode. Pass with --dynamics.
# After real/Gazebo flights, `python -m team_mission.rl.fit_dynamics <logs> --out measured.yaml`
# writes a file in the same format centred on what it measured.
kp_xy: [0.7, 1.3]            # 1/s   PX4 MPC_XY_P
kp_z: [0.7, 1.3]             # 1/s   PX4 MPC_Z_P
tau: [0.2, 0.6]              # s     velocity response
vel_i: [0.5, 2.0]            # 1/s^2 velocity integral
max_accel: [1.5, 4.0]        # m/s^2
px4_max_speed: [1.0, 2.0]    # m/s
k_yaw: [1.5, 3.0]            # 1/s
max_yaw_rate: [0.6, 1.2]     # rad/s
yaw_tau: [0.05, 0.25]        # s
delay_steps: [0, 3]          # x 50 ms
pos_noise: [0.002, 0.015]    # m
vel_noise: [0.01, 0.06]      # m/s
drift_per_sqrt_m: [0.0, 0.02]  # m per sqrt(m flown)
drift_rate: [0.0, 0.003]     # m per sqrt(s)
yaw_drift_rate: [0.0, 0.01]  # rad per sqrt(s)
disturbance: [0.0, 0.35]     # m/s^2
disturbance_tau: [0.5, 3.0]  # s
