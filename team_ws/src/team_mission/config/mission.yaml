# team_mission parameters. Loaded by launch/mission.launch.py; any value can be overridden on the
# command line:  ros2 launch team_mission mission.launch.py checkpoints:=test_square.yaml
team_mission:
  ros__parameters:
    # ---------------------------------------------------------------- what to fly
    checkpoints: test_line.yaml        # a file in config/checkpoints/ or an absolute path
    policy: carrot                     # 'carrot' (hand-written baseline) or a .npz in policies/
    # Where base_link (the Pixhawk) sits at boot, in published-course coordinates, and which
    # way the nose points (deg, CCW from course +x). Only used by 'frame: course' checkpoint files.
    # DroneHacks course v3 launch mark, nose up the first guideline leg:
    launch_x: -2.515
    launch_y: 0.914
    launch_z: 0.0
    launch_yaw_deg: 90.0

    # ---------------------------------------------------------------- speed (SLOW). Training
    # used the same numbers; a policy trained with different limits logs a warning.
    max_xy_speed: 0.40                 # m/s
    max_z_speed: 0.25                  # m/s
    max_yaw_rate: 0.50                 # rad/s
    lead_time: 1.0                     # s
    max_carrot_m: 0.60                 # m
    yaw_lead_s: 0.6                    # s

    # ---------------------------------------------------------------- mission
    takeoff_height: 1.0                # m above the start, by cuVSLAM z
    climb_rate: 0.3                    # m/s
    takeoff_tolerance: 0.08            # m
    settle_s: 1.5                      # s of steady hover before moving on
    hover_height: 0.3                  # m above the start ground before touchdown
    descent_rate: 0.2                  # m/s
    touchdown_speed: 0.2               # m/s, the final twist down
    disarm_timeout_s: 8.0              # s after landing before we complain that PX4 did not disarm
    odom_timeout_s: 0.3                # s
    require_vslam_status: true         # need /visual_slam/status vo_state == 1 (false in simulators)
    hold_resume_s: 2.0
    hold_timeout_s: 20.0
    corridor_margin: 0.05
    max_holds: 4
    fly_timeout_s: 300.0

    # ---------------------------------------------------------------- topics
    odom_topic: /visual_slam/tracking/odometry
    status_topic: /visual_slam/status
    state_topic: /skybeta/state
    pose_topic: /skybeta/setpoint/pose
    twist_topic: /skybeta/setpoint/twist
    extra_health_topic: ''             # e.g. /team/localization/ok (team_localization package)
    rate_hz: 20.0
    log_dir: ''                        # '' = /root/team_ws/flight_logs on the drone
