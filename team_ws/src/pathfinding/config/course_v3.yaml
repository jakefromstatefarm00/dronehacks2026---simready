# DroneHacks 2026 course v3 - training configuration
# Everything you are likely to tweak lives here. Units: metres, seconds, radians. Z up.

course_obj: course/dronehacks-course-v3.obj

# ---------------------------------------------------------------- rules (ASSUMED - check!)
rules:
  # Walls are 1.727 m tall and the net is 3.048 m, so a drone *could* hop over everything.
  # We assume that is not allowed: flying above this height ends the episode as a crash.
  ceiling_z: 1.65
  floor_z: 0.15            # below this (outside the final landing hand-off) counts as hitting the floor
  max_speed: 2.5           # soft speed limit: speed above this is penalised (raise as you gain confidence)
  episode_seconds: 30.0

# ---------------------------------------------------------------- drone model
drone:
  mass: 1.6                # kg, Orin Nano + OAK-D + Pixhawk 6C on a ~450 mm frame. WEIGH YOURS.
  thrust_to_weight: 2.5    # max total thrust / weight. Measure with a thrust stand or estimate from motor data.
  collision_radius: 0.25   # metres, horizontal: centre to prop tip + margin. Window is 0.91 m wide - keep this honest.
  collision_half_height: 0.12  # metres, vertical half-thickness incl. allowance for tilting ~25 deg
  max_rates: [3.0, 3.0, 2.0]   # roll, pitch, yaw rate limits the policy may command (rad/s)
  rate_time_constant: 0.05     # s, how fast PX4's rate controller tracks a commanded rate
  thrust_time_constant: 0.04   # s, motor spin-up lag
  linear_drag: [0.30, 0.30, 0.40]  # N per (m/s), body frame
  hover_thrust_override: null  # optional measured MPC_THR_HOVER-style value (0..1) to sanity check

# ---------------------------------------------------------------- domain randomisation
randomization:
  mass_frac: 0.10
  twr_frac: 0.10
  drag_frac: 0.30
  lag_frac: 0.30
  obs_noise: {pos: 0.02, vel: 0.05, att: 0.02, rate: 0.05}
  action_delay_prob: 0.3        # chance an episode runs with one extra control step of latency
  wind_accel: 0.3               # m/s^2 random constant disturbance (prop wash off the net/walls)

# ---------------------------------------------------------------- simulation / control
sim:
  physics_dt: 0.005
  control_hz: 50                # policy rate; PX4 offboard rate setpoints at 50 Hz is comfortable

# ---------------------------------------------------------------- start
start:
  position: [-2.515, 0.914, 1.0]   # above the launch mark, after a PX4 takeoff to 1 m
  yaw: 1.5708                      # facing +Y (up the first guideline leg)
  random_start_prob: 0.6           # curriculum: start part-way along the course this often

# ---------------------------------------------------------------- reward weights
reward:
  progress: 1.0          # per metre of progress toward the current gate
  gate_bonus: 1.0        # each gate passed
  finish_bonus: 10.0     # reached the hover point above the pad
  crash: -5.0
  missed_gate: -5.0
  time: -0.01            # per control step
  body_rate: -0.002      # * |omega|^2 (roll/pitch; yaw counts 1/4 so turning the camera is cheap)
  action_change: -0.01   # * |a_t - a_{t-1}|^2
  over_speed: -0.05      # * (speed - max_speed) when above limit
  camera: 0.03           # penalty * (1 - exp(-(angle/0.6 rad)^2)), angle = camera axis vs direction to next gate.
                         #   Keeps the OAK-D looking where it is going, which visual odometry needs. 0 to disable.
                         #   Keep it a penalty: a positive bonus teaches the drone to hover and stare.

# ---------------------------------------------------------------- gate sequence
# type: plane  -> must cross the plane through `centre` (moving along `normal`) inside the rectangle
#                 half_width (horizontal) x half_height (vertical). Crossing outside = missed gate.
# from: window | tube_entry | tube_exit -> centre/normal/size taken from the OBJ automatically.
# type: hover  -> finish: within `radius` of centre and slower than `max_speed`.
gates:
  # Zone 1: follow the floor guideline. Corner gates sit on the guideline corners; half_width is how
  # far you may cut the corner. Make it smaller if judges score staying on the line.
  - {name: z1_corner1, type: plane, centre: [-2.515, 2.585, 1.0], normal: [1, 1],  half_width: 0.40, half_height: 0.35}
  - {name: z1_corner2, type: plane, centre: [-1.372, 2.585, 1.0], normal: [1, -1], half_width: 0.40, half_height: 0.35}
  - {name: z1_corner3, type: plane, centre: [-1.372, 0.970, 1.0], normal: [1, -1], half_width: 0.40, half_height: 0.35}
  - {name: z1_corner4, type: plane, centre: [-0.254, 0.970, 1.0], normal: [1, 1],  half_width: 0.40, half_height: 0.35}
  - {name: z1_corner5, type: plane, centre: [-0.254, 2.585, 1.0], normal: [1, 1],  half_width: 0.40, half_height: 0.35}
  - {name: z1_end,     type: plane, centre: [0.330, 2.585, 1.0],  normal: [1, 0],  half_width: 0.40, half_height: 0.35}
  # Stage 2: the oval tube, flown north -> south
  - {name: tube_in,  type: plane, from: tube_entry, margin: 0.05}
  - {name: tube_out, type: plane, from: tube_exit,  margin: 0.05}
  # Stage 3: chicane - through the window in C2a, east -> west
  - {name: window, type: plane, from: window, direction: west, margin: 0.0}
  # Stage 4: approach ring and pad. The policy brings the drone to a slow hover over the pad;
  # PX4's own LAND mode does the touchdown.
  - {name: pad_hover, type: hover, centre: [-2.042, -0.792, 0.6], radius: 0.30, max_speed: 0.5}
